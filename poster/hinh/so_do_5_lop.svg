<text x="1970" y="238" font-size="36" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Kiểm tra ổn định</text>
<text x="1902" y="300" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Tìm cặp phá vỡ bằng</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1020" width="2400" height="1020" font-family="'IBM Plex Sans',Arial,sans-serif">
<rect width="2400" height="1020" fill="#FFFFFF"/>
<rect x="30" y="30" width="300" height="560" rx="18" fill="#F3F4F1" stroke="#DBDCD5" stroke-width="3"/>
<text x="62" y="100" font-size="40" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Đầu vào</text>
<text x="62" y="162" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Danh sách CLB</text>
<text x="62" y="204" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· số chỗ</text>
<text x="62" y="246" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· suất dự trữ</text>
<text x="62" y="288" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif"></text>
<text x="62" y="330" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Điểm thi</text>
<text x="62" y="372" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· chấm mù</text>
<text x="62" y="414" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif"></text>
<text x="62" y="456" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Nguyện vọng</text>
<text x="62" y="498" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· xếp hạng CLB</text>
<line x1="330" y1="310" x2="372" y2="310" stroke="#5B6570" stroke-width="5"/><path d="M364,294 L390,310 L364,326 Z" fill="#5B6570"/>
<rect x="390" y="30" width="580" height="560" rx="18" fill="#FFFFFF" stroke="#27805A" stroke-width="3"/>
<circle cx="446" cy="88" r="30" fill="#B8781A"/>
<text x="446" y="99" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">1</text>
<text x="494" y="100" font-size="40" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Xếp ưu tiên ở mỗi CLB</text>
<text x="422" y="162" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Tầng 1 · em đã thi CLB đó</text>
<text x="422" y="204" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· điểm cao xếp trước</text>
<text x="422" y="246" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· bằng điểm → số bốc thăm nhỏ trước</text>
<text x="422" y="288" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Tầng 2 · em không thi CLB đó</text>
<text x="422" y="330" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">· xếp theo số bốc thăm</text>
<text x="422" y="372" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Tầng 1 luôn đứng trước tầng 2</text>
<text x="422" y="414" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif"></text>
<text x="422" y="456" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">CLB không biết em chọn mình</text>
<text x="422" y="498" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">là nguyện vọng thứ mấy</text>
<line x1="970" y1="310" x2="1012" y2="310" stroke="#5B6570" stroke-width="5"/><path d="M1004,294 L1030,310 L1004,326 Z" fill="#5B6570"/>
<rect x="1030" y="30" width="770" height="560" rx="18" fill="#DCE9E0" stroke="#27805A" stroke-width="4"/>
<circle cx="1086" cy="88" r="30" fill="#B8781A"/>
<text x="1086" y="99" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">2</text>
<text x="1134" y="102" font-size="40" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Xét duyệt nhiều vòng</text>
<text x="1062" y="164" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">1. Em nộp vào nguyện vọng cao nhất còn mở</text>
<text x="1062" y="206" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">2. CLB giữ tạm các em ưu tiên cao nhất</text>
<text x="1062" y="248" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">3. Em bị trả lại nộp nguyện vọng kế tiếp</text>
<text x="1062" y="290" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">4. Lặp đến khi không còn ai phải nộp lại</text>
<rect x="1062" y="350" width="706" height="214" rx="18" fill="#FFFFFF" stroke="#B8781A" stroke-width="3"/>
<text x="1094" y="412" font-size="32" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Suất dự trữ — xét hai lượt</text>
<text x="1094" y="470" font-size="26" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Lượt 1 · chỉ xét em thuộc diện dự trữ</text>
<text x="1094" y="508" font-size="26" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Lượt 2 · xét chung phần chỗ còn lại</text>
<text x="1094" y="546" font-size="26" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Dư suất dự trữ → tự chuyển sang xét chung</text>
<line x1="1800" y1="310" x2="1842" y2="310" stroke="#5B6570" stroke-width="5"/><path d="M1834,294 L1860,310 L1834,326 Z" fill="#5B6570"/>
<rect x="1860" y="30" width="510" height="300" rx="18" fill="#FFFFFF" stroke="#27805A" stroke-width="3"/>
<circle cx="1916" cy="88" r="30" fill="#B8781A"/>
<text x="1916" y="99" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">3</text>
<text x="1964" y="100" font-size="40" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Kiểm tra</text>
<text x="1892" y="162" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Tìm cặp phá vỡ: em thích CLB</text>
<text x="1892" y="204" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">khác hơn và CLB đó cũng nhận em</text>
<text x="1892" y="246" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Yêu cầu: 0 cặp</text>
<line x1="2115" y1="330" x2="2115" y2="362" stroke="#5B6570" stroke-width="5"/><path d="M2099,355 L2115,380 L2131,355 Z" fill="#5B6570"/>
<rect x="1860" y="380" width="510" height="210" rx="18" fill="#F3F4F1" stroke="#DBDCD5" stroke-width="3"/>
<text x="1892" y="450" font-size="40" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Kết quả</text>
<text x="1892" y="512" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Mỗi em một CLB</text>
<text x="1892" y="554" font-size="28" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Xuất danh sách từng CLB</text>
<line x1="680" y1="590" x2="680" y2="632" stroke="#5B6570" stroke-width="5"/><path d="M664,625 L680,650 L696,625 Z" fill="#5B6570"/>
<rect x="30" y="650" width="2340" height="320" rx="18" fill="#F1DFB8" stroke="#B8781A" stroke-width="3"/>
<text x="62" y="712" font-size="36" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Bốc thăm hoạt động thế nào</text>
<rect x="62.0" y="740" width="548.0" height="200" rx="18" fill="#FFFFFF" stroke="#B8781A" stroke-width="2"/>
<text x="94.0" y="800" font-size="30" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Một em · một số</text>
<text x="94.0" y="856" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Bốc một lần cho mỗi học sinh</text>
<text x="94.0" y="892" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Dùng chung cho mọi CLB</text>
<text x="94.0" y="928" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Số nhỏ hơn → ưu tiên hơn</text>
<rect x="638.0" y="740" width="548.0" height="200" rx="18" fill="#FFFFFF" stroke="#B8781A" stroke-width="2"/>
<text x="670.0" y="800" font-size="30" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Chỉ dùng khi hoà</text>
<text x="670.0" y="856" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Hai em bằng điểm ở cùng CLB</text>
<text x="670.0" y="892" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">hoặc em không thi CLB đó</text>
<text x="670.0" y="928" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Điểm luôn quyết định trước</text>
<rect x="1214.0" y="740" width="548.0" height="200" rx="18" fill="#FFFFFF" stroke="#B8781A" stroke-width="2"/>
<text x="1246.0" y="800" font-size="30" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Kiểm tra lại được</text>
<text x="1246.0" y="856" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Không phụ thuộc thứ tự nhập tên</text>
<text x="1246.0" y="892" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Cùng dữ liệu + cùng hạt giống</text>
<text x="1246.0" y="928" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">→ ra đúng một kết quả</text>
<rect x="1790.0" y="740" width="548.0" height="200" rx="18" fill="#FFFFFF" stroke="#B8781A" stroke-width="2"/>
<text x="1822.0" y="800" font-size="30" fill="#1C2321" font-weight="700" text-anchor="start" font-family="'Be Vietnam Pro','IBM Plex Sans',Arial,sans-serif">Khoá sau khi bốc</text>
<text x="1822.0" y="856" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Em thêm muộn chèn vào vị trí ngẫu nhiên</text>
<text x="1822.0" y="892" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Thứ tự các em cũ giữ nguyên</text>
<text x="1822.0" y="928" font-size="25" fill="#5B6570" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Muốn bốc lại phải bấm "Vẽ lại"</text>
<text x="30" y="1005" font-size="24" fill="#8A929A" font-weight="400" text-anchor="start" font-family="'IBM Plex Sans',Arial,sans-serif">Sơ đồ do AI tạo ra</text>
</svg>